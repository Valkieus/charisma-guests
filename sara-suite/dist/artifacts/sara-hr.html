<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8E%93%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
/* Socle visuel commun aux trois applications de la suite */
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --panel-2: #f0f2f8;
  --line: #e2e5ee;
  --text: #1b1f2e;
  --muted: #646b80;
  --accent: #4f46e5;
  --accent-2: color-mix(in srgb, var(--accent) 13%, var(--panel));
  --accent-text: #ffffff;
  --ok: #15803d;
  --ok-bg: #e7f6ec;
  --warn: #b45309;
  --warn-bg: #fdf3e2;
  --bad: #b91c1c;
  --bad-bg: #fdeaea;
  --info: #0369a1;
  --info-bg: #e5f3fb;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 16px rgba(20, 24, 40, .05);
  --radius: 12px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --panel: #171b2d; --panel-2: #1e2338; --line: #2a3050;
    --text: #e8eaf3; --muted: #9aa1ba;
    --ok-bg: #12301f; --warn-bg: #3a2a10; --bad-bg: #3b1616; --info-bg: #10283a;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #38bdf8;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --panel: #171b2d; --panel-2: #1e2338; --line: #2a3050;
  --text: #e8eaf3; --muted: #9aa1ba;
  --ok-bg: #12301f; --warn-bg: #3a2a10; --bad-bg: #3b1616; --info-bg: #10283a;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #38bdf8;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
small, .muted { color: var(--muted); }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: .9em; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1rem 0; }

/* Mise en page */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.app > div { min-width: 0; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; padding: 4px 10px 14px; }
.brand .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: .95rem; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--panel-2); }
.nav a.active { background: var(--accent-2); color: var(--accent); font-weight: 650; }
.nav .sec { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 10px 4px; font-weight: 700; }

.side .foot { margin-top: auto; padding: 10px; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); }
.main { padding: 26px 32px 60px; max-width: 1280px; width: 100%; min-width: 0; }
.topbar { display: none; }

.card + .card { margin-top: 14px; }
.card h3 { margin-bottom: .6em; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; }
.kpi .l { color: var(--muted); font-size: .85rem; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 14px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }

.btn.ghost { border-color: transparent; background: transparent; }

label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

textarea { min-height: 80px; resize: vertical; }
.field { margin-bottom: 12px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: .78rem; font-weight: 650; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.acc { background: var(--accent-2); color: var(--accent); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--panel-2); }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }

.progress { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs a, .tabs button { padding: 9px 14px; border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; text-decoration: none; white-space: nowrap; }
.tabs .active { color: var(--accent); border-bottom-color: var(--accent); }

.alert { padding: 12px 14px; border-radius: 10px; background: var(--info-bg); color: var(--text); border-left: 4px solid var(--info); margin-bottom: 12px; }
.alert.ok { background: var(--ok-bg); border-color: var(--ok); }
.alert.warn { background: var(--warn-bg); border-color: var(--warn); }
.alert.bad { background: var(--bad-bg); border-color: var(--bad); }
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }

/* Kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--panel-2); border-radius: var(--radius); padding: 10px; min-height: 200px; }
.col h4 { display: flex; justify-content: space-between; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 4px 10px; }
.col.over { outline: 2px dashed var(--accent); }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: grab; box-shadow: var(--shadow); }
.tcard .t { font-weight: 600; margin-bottom: 6px; }
.tcard .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); align-items: center; }

/* Modale & toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 12, 24, .5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal.wide { width: min(900px, 100%); }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 60; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* Authentification */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.auth .box { width: min(440px, 100%); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-2); color: var(--accent); display: inline-grid; place-items: center; font-weight: 700; font-size: .78rem; flex: none; }
.lesson { max-width: 780px; }
.lesson h2 { margin-top: 1.2em; }
.lesson ul, .lesson ol { padding-left: 1.3em; }
.lesson li { margin-bottom: .3em; }
.lesson table { margin: .8em 0; border: 1px solid var(--line); }
.callout { background: var(--accent-2); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.callout.tip::before { content: "💡 "; } .callout.warn::before { content: "⚠️ "; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
  .main { padding: 18px 16px 60px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .g4.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fields { grid-template-columns: 1fr; }
}
@media print {
  .side, .topbar, .no-print { display: none !important; }
  .app { display: block; } .main { padding: 0; }
  .card { box-shadow: none; }
}

/* Styles propres à Sara HR */
.hero { background: linear-gradient(135deg, var(--accent), #7c3aed); color: #fff; border-radius: 16px; padding: 22px; margin-bottom: 14px; }
.hero h1 { color: #fff; margin-bottom: 4px; }
.hero .progress { background: rgba(255,255,255,.25); }

.hero .muted, .hero small { color: rgba(255,255,255,.85); }
.mod-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; transition: transform .12s; }
.mod-card:hover { transform: translateY(-2px); }

.tagpub { background: #e0e7ff; color: #3730a3; } .tagpriv { background: #fef3c7; color: #92400e; } .tagcom { background: #dcfce7; color: #166534; }
:root[data-theme="dark"] .tagpub, :root[data-theme="dark"] .tagpriv, :root[data-theme="dark"] .tagcom { background: var(--panel-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tagpub, :root:not([data-theme="light"]) .tagpriv, :root:not([data-theme="light"]) .tagcom { background: var(--panel-2); } }

.flash { perspective: 1200px; max-width: 560px; margin: 0 auto; cursor: pointer; }

.flash-front { background: var(--panel); font-size: 1.2rem; font-weight: 700; }
.flash-back { background: var(--accent-2); transform: rotateY(180deg); font-size: 1.02rem; }
.flash small { position: absolute; top: 12px; left: 16px; font-weight: 500; font-size: .75rem; }

.choice { display: block; width: 100%; text-align: left; white-space: normal; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-2); }
.choice.good { background: var(--ok-bg); border-color: var(--ok); }
.choice.bad { background: var(--bad-bg); border-color: var(--bad); }
.choice.sel { border-color: var(--accent); background: var(--accent-2); }
.choice:disabled { cursor: default; }

.memory { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mcard { min-height: 96px; border-radius: 12px; border: 1px solid var(--line); background: var(--accent); color: #fff; display: grid; place-items: center; text-align: center; padding: 8px; font-size: .82rem; cursor: pointer; font-weight: 600; user-select: none; }
.mcard.open { background: var(--panel); color: var(--text); }
.mcard.done { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); cursor: default; }
@media (max-width: 600px) { .memory { grid-template-columns: repeat(3, minmax(0, 1fr)); } .mcard { font-size: .74rem; min-height: 84px; } }

.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.3rem; }
.gauge { display: grid; grid-template-columns: 130px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: .9rem; }
.badge-big { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 12px 8px; border-radius: 12px; background: var(--panel-2); font-size: .8rem; }
.badge-big .i { font-size: 1.8rem; }
.badge-big.locked { opacity: .35; filter: grayscale(1); }
.cert { text-align: center; border: 4px double var(--accent); border-radius: 16px; padding: 40px 24px; background: var(--panel); }
.big-btn { font-size: 1.05rem; padding: 12px 20px; }

:root{--accent:#be185d}

<script>
/* ---- shared/core.js ---- */
/* Outils communs aux trois applications : stockage, comptes, routage, modales. */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const fmtDate = (iso) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtEur = (n) => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmtEur2 = (n) => (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const initials = (name) => String(name || '?').split(/\s+/).map((p) => p[0]).join('').slice(0, 2).toUpperCase();
const shuffle = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const pick = (a, n) => shuffle(a).slice(0, n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* Stockage local, isolé par application (préfixe). */
function makeStore(prefix) {
  const mem = {};
  return {
    get(key, def) {
      try { const raw = localStorage.getItem(prefix + key); return raw == null ? (key in mem ? mem[key] : def) : JSON.parse(raw); }
      catch { return key in mem ? mem[key] : def; }
    },
    set(key, val) {
      mem[key] = val;
      try { localStorage.setItem(prefix + key, JSON.stringify(val)); } catch { /* stockage indisponible : on garde en mémoire */ }
    },
    del(key) { delete mem[key]; try { localStorage.removeItem(prefix + key); } catch { } },
    dump() {
      const out = {};
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(prefix)) out[k.slice(prefix.length)] = JSON.parse(localStorage.getItem(k)); } }
      catch { Object.assign(out, mem); }
      return out;
    },
    load(obj) { Object.entries(obj).forEach(([k, v]) => this.set(k, v)); },
    clear() { Object.keys(this.dump()).forEach((k) => this.del(k)); },
  };
}

async function hashPassword(pw, salt) {
  const data = new TextEncoder().encode(salt + '::' + pw);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0; return 'x' + h.toString(16);
}

/* Comptes utilisateurs (locaux au navigateur). */
function makeAuth(store) {
  return {
    users() { return store.get('users', []); },
    saveUsers(list) { store.set('users', list); },
    current() { const id = store.get('session', null); return this.users().find((u) => u.id === id) || null; },
    async create({ name, email, password, role = 'member', wsId, extra = {} }) {
      email = String(email).trim().toLowerCase();
      if (!name || !email || !password) throw new Error('Nom, e-mail et mot de passe sont obligatoires.');
      if (password.length < 6) throw new Error('Le mot de passe doit faire au moins 6 caractères.');
      if (this.users().some((u) => u.email === email)) throw new Error('Un compte existe déjà avec cet e-mail.');
      const salt = uid();
      const user = { id: uid(), name: name.trim(), email, salt, pw: await hashPassword(password, salt), role, wsId, created: todayISO(), ...extra };
      this.saveUsers([...this.users(), user]);
      return user;
    },
    async login(email, password) {
      email = String(email).trim().toLowerCase();
      const u = this.users().find((x) => x.email === email);
      if (!u || u.pw !== await hashPassword(password, u.salt)) throw new Error('E-mail ou mot de passe incorrect.');
      store.set('session', u.id);
      return u;
    },
    async setPassword(userId, password) {
      if (password.length < 6) throw new Error('Le mot de passe doit faire au moins 6 caractères.');
      const list = this.users(); const u = list.find((x) => x.id === userId); if (!u) return;
      u.salt = uid(); u.pw = await hashPassword(password, u.salt); u.mustChange = false; this.saveUsers(list);
    },
    update(userId, patch) { const list = this.users(); const u = list.find((x) => x.id === userId); if (u) Object.assign(u, patch); this.saveUsers(list); return u; },
    remove(userId) { this.saveUsers(this.users().filter((u) => u.id !== userId)); },
    logout() { store.del('session'); },
  };
}

function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

/* Modale générique. body = HTML ; onSubmit(formData, el) peut renvoyer false pour garder ouvert. */
function modal({ title, body, submit = 'Enregistrer', cancel = 'Annuler', wide = false, onSubmit, onOpen, danger }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal ${wide ? 'wide' : ''}" novalidate><h2>${esc(title)}</h2><div class="mbody">${body}</div>
    <div class="actions">${danger ? `<button type="button" class="btn danger" data-danger style="margin-right:auto">${esc(danger.label)}</button>` : ''}
    ${cancel ? `<button type="button" class="btn" data-cancel>${esc(cancel)}</button>` : ''}${submit ? `<button class="btn primary">${esc(submit)}</button>` : ''}</div></form>`;
  const form = bg.querySelector('form');
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  form.querySelector('[data-cancel]')?.addEventListener('click', close);
  form.querySelector('[data-danger]')?.addEventListener('click', async () => { if (await danger.onClick() !== false) close(); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form).entries());
    $$('input[type=checkbox]', form).forEach((c) => { if (c.name) fd[c.name] = c.checked; });
    try { if (!onSubmit || await onSubmit(fd, form) !== false) close(); }
    catch (err) { toast(err.message || String(err)); }
  });
  document.body.appendChild(bg);
  onOpen?.(form);
  form.querySelector('input:not([type=hidden]),select,textarea')?.focus();
  return { close, form };
}
/* Confirmation intégrée à la page (les boîtes natives sont bloquées dans certains lecteurs). */
function ask(text, ok = 'Confirmer') {
  return new Promise((res) => {
    const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.style.zIndex = 70;
    bg.innerHTML = `<div class="modal" role="alertdialog" style="width:min(440px,100%)"><p style="font-weight:600;margin:0">${esc(text)}</p><div class="actions"><button type="button" class="btn" data-no>Annuler</button><button type="button" class="btn primary" data-yes>${esc(ok)}</button></div></div>`;
    const done = (v) => { bg.remove(); res(v); };
    bg.querySelector('[data-no]').onclick = () => done(false);
    bg.querySelector('[data-yes]').onclick = () => done(true);
    document.body.appendChild(bg); bg.querySelector('[data-yes]').focus();
  });
}

/* Champs de formulaire */
function fInput(name, label, value = '', { type = 'text', full = false, req = false, attrs = '' } = {}) {
  return `<div class="field ${full ? 'full' : ''}"><label>${esc(label)}${req ? ' *' : ''}</label><input name="${name}" type="${type}" value="${esc(value)}" ${req ? 'required' : ''} ${attrs}></div>`;
}
function fSelect(name, label, options, value = '', { full = false } = {}) {
  const opts = options.map((o) => (typeof o === 'string' ? [o, o] : o)).map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`).join('');
  return `<div class="field ${full ? 'full' : ''}"><label>${esc(label)}</label><select name="${name}">${opts}</select></div>`;
}
function fText(name, label, value = '', { full = true } = {}) {
  return `<div class="field ${full ? 'full' : ''}"><label>${esc(label)}</label><textarea name="${name}">${esc(value)}</textarea></div>`;
}

/* Routeur par hash : #/route/param */
function makeRouter(routes, fallback) {
  const run = () => {
    $$('.modal-bg').forEach((m) => m.remove());
    const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').map(decodeURIComponent);
    const fn = routes[parts[0]] || fallback;
    fn(...parts.slice(1));
    $$('.nav a').forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#/' + parts[0]));
    $('.side')?.classList.remove('open');
    window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', run);
  return { run, go: (h) => { if (location.hash === h) run(); else location.hash = h; } };
}

function download(filename, content, type = 'application/json') {
  const blob = new Blob([content], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function pickFile(accept = '.json') {
  return new Promise((res) => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => res(r.result); r.readAsText(f); }; i.click(); });
}
function toCSV(rows) {
  return rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
}

    { t: 'Avancement d\'échelon et de grade', html: `
<p>Chaque grade comporte une série d'<strong>échelons</strong>. À chaque échelon correspond un indice (donc un traitement).</p>
<ul><li><strong>Avancement d'échelon</strong> : en fonction de l'<strong>ancienneté</strong>, selon une durée fixée par le statut particulier (durée unique depuis le protocole PPCR). C'est un <strong>droit</strong>. Un arrêté est pris.</li>
<li><strong>Avancement de grade</strong> : passage au grade supérieur dans le même cadre d'emplois (ex. adjoint administratif → adjoint administratif principal de 2e classe). Il se fait <strong>au choix</strong> (inscription au <strong>tableau annuel d'avancement</strong>), parfois après un <strong>examen professionnel</strong>. L'agent doit remplir des conditions (échelon, ancienneté) : il est alors <strong>« promouvable »</strong>.</li>

<p>La <strong>promotion interne</strong> permet de changer de cadre d'emplois / corps (souvent de catégorie : C → B, B → A) sans concours, par <strong>liste d'aptitude</strong> établie au choix ou après examen professionnel. Elle est contingentée (quotas liés aux recrutements).</p>
<p>Les <strong>lignes directrices de gestion (LDG)</strong>, issues de la loi du 6 août 2019 de transformation de la fonction publique, fixent :</p>
<ul><li>la <strong>stratégie pluriannuelle de pilotage des ressources humaines</strong> ;</li><li>les <strong>orientations et critères</strong> en matière de promotion et de valorisation des parcours.</li></ul>
<p>Elles sont arrêtées par l'autorité après avis du CST / CSA, pour 6 ans maximum, et communiquées aux agents. Depuis 2021, les <strong>CAP ne donnent plus d'avis</strong> préalable sur les avancements et promotions : la transparence passe par les LDG.</p>` },
    { t: 'Les positions statutaires', html: `
<p>Un fonctionnaire est toujours dans l'une de ces <strong>positions</strong> :</p>
<ul><li><strong>Activité</strong> : il exerce les fonctions de son grade (y compris à temps partiel, en congé, ou en <strong>mise à disposition</strong> auprès d'un autre organisme).</li>
<li><strong>Détachement</strong> : il est placé hors de son corps / cadre d'emplois d'origine pour exercer ailleurs (autre administration, autre corps), en continuant à bénéficier de ses droits à avancement et retraite dans son corps d'origine. Il est réintégré à l'issue.</li>
<li><strong>Disponibilité</strong> : il cesse temporairement de travailler, <strong>sans traitement</strong> et, en principe, sans droits à avancement ni retraite. Disponibilité de droit (élever un enfant de moins de 12 ans, donner des soins à un proche…) ou sur demande (convenances personnelles, création d'entreprise…), ou d'office (fin de droits à congé maladie). Depuis 2019, l'agent qui exerce une activité professionnelle pendant sa disponibilité conserve ses droits à avancement pendant 5 ans maximum.</li>
<li><strong>Congé parental</strong> : pour élever un enfant ; droits à avancement conservés (dans certaines limites).</li></ul>` },
    { t: 'La mobilité', html: `
<ul><li><strong>Mutation</strong> : changement d'employeur ou d'affectation dans le même grade. En FPT, l'agent postule dans une autre collectivité, qui le recrute par voie de mutation ; un préavis peut être imposé (3 mois maximum, sauf accord).</li>
<li><strong>Détachement</strong> puis éventuelle <strong>intégration</strong> dans un autre corps / cadre d'emplois.</li>
<li><strong>Intégration directe</strong> : changement de corps ou cadre d'emplois de même catégorie et niveau, sans détachement préalable.</li>
<li>Mobilité entre versants (État ↔ territoriale ↔ hospitalière) : possible par détachement ou intégration directe.</li></ul>
<div class="callout tip">Pour le service RH, chaque mouvement = un acte (arrêté), une mise à jour du dossier et souvent une information des caisses (CNRACL…) et du CDG.</div>` },

MODULES.push({
  id: 'remuneration', ico: '💶', title: 'Rémunération et paie', tag: 'commun', level: 'Intermédiaire',
  summary: 'Le traitement indiciaire, les primes (RIFSEEP, NBI…), les cotisations, et la comparaison avec un bulletin de paie privé.',
  lessons: [
    { t: 'Les éléments de la rémunération publique', html: `
<p>La rémunération d'un fonctionnaire comprend (art. L712-1 du CGFP) :</p>
<ol><li>le <strong>traitement indiciaire</strong> ;</li><li>l'<strong>indemnité de résidence</strong> (0, 1 ou 3 % du traitement selon la commune d'affectation) ;</li><li>le <strong>supplément familial de traitement (SFT)</strong>, si l'agent a des enfants à charge ;</li><li>les <strong>primes et indemnités</strong> instituées par un texte.</li></ol>
<h2>Le traitement indiciaire</h2>
<p>Chaque échelon de chaque grade correspond à un <strong>indice brut (IB)</strong> qui détermine un <strong>indice majoré (IM)</strong>. Le traitement brut mensuel = <strong>IM × valeur du point d'indice</strong>.</p>
<p>Valeur du point depuis le 1er juillet 2023 : <strong>4,92278 € par mois</strong> (soit 5 907,34 € par an pour l'indice 100). Le point est fixé par décret ; il a été peu revalorisé ces dernières années (vérifiez la valeur en vigueur).</p>
<div class="callout">Exemple : IM 400 × 4,92278 € = <strong>1 969,11 € brut par mois</strong> de traitement indiciaire.</div>` },
    { t: 'Primes : RIFSEEP, NBI et autres', html: `
<ul><li><strong>RIFSEEP</strong> (régime indemnitaire tenant compte des fonctions, des sujétions, de l'expertise et de l'engagement professionnel), régime de référence :
<ul><li><strong>IFSE</strong> : versée mensuellement, selon le <strong>groupe de fonctions</strong> du poste (ex. C1, C2 ; B1…), réexaminée en cas de changement de fonctions et au moins tous les 4 ans ;</li><li><strong>CIA</strong> : complément indemnitaire annuel, facultatif, lié à l'engagement et à la manière de servir (appréciés lors de l'entretien professionnel).</li></ul>
En FPT, le RIFSEEP est institué par <strong>délibération</strong>, dans la limite de ce que perçoivent les corps équivalents de l'État (principe de parité).</li>

MODULES.push({
  id: 'droitprive', ico: '🏢', title: 'Droit du travail privé : contrats et ruptures', tag: 'prive', level: 'Intermédiaire',
  summary: 'CDI, CDD, période d\'essai, démission, licenciement, rupture conventionnelle : les règles du Code du travail.',
  lessons: [
    { t: 'Les contrats', html: `
<ul><li><strong>CDI</strong> : forme normale de la relation de travail. Écrit recommandé (obligatoire pour un temps partiel).</li>
<li><strong>CDD</strong> : uniquement pour une tâche précise et temporaire, dans les cas prévus par la loi : remplacement d'un salarié absent, accroissement temporaire d'activité, emploi saisonnier, CDD d'usage… <strong>Écrit obligatoire</strong> avec le motif, remis dans les 2 jours ouvrables. Durée maximale en principe <strong>18 mois</strong>, renouvellements compris (2 renouvellements). Délai de carence entre deux CDD sur le même poste. <strong>Indemnité de fin de contrat : 10 %</strong> de la rémunération brute totale (sauf exceptions).</li>
<li>Un CDD irrégulier peut être <strong>requalifié en CDI</strong> par le juge.</li>
<li>Autres : intérim (contrat de mission), apprentissage, contrat de professionnalisation, temps partiel (24 h / semaine minimum en principe).</li></ul>` },
    { t: 'La période d\'essai', html: `
<table><tr><th>Catégorie (CDI)</th><th>Durée maximale initiale</th><th>Renouvellement compris (si accord de branche)</th></tr>
<tr><td>Ouvriers, employés</td><td>2 mois</td><td>4 mois</td></tr><tr><td>Agents de maîtrise, techniciens</td><td>3 mois</td><td>6 mois</td></tr><tr><td>Cadres</td><td>4 mois</td><td>8 mois</td></tr></table>
<p>CDD : 1 jour par semaine, dans la limite de 2 semaines (contrat ≤ 6 mois) ou 1 mois (contrat > 6 mois).</p>
<p>La période d'essai doit être <strong>prévue au contrat</strong>. Sa rupture est libre mais doit respecter un <strong>délai de prévenance</strong> (de 24 heures à 1 mois selon la présence du salarié) et ne pas être abusive ou discriminatoire.</p>` },
    { t: 'Les modes de rupture du CDI', html: `
<ul><li><strong>Démission</strong> : volonté claire et non équivoque du salarié ; préavis selon la convention. Depuis 2023, l'<strong>abandon de poste</strong> peut, après mise en demeure, valoir présomption de démission.</li>
<li><strong>Licenciement pour motif personnel</strong> : cause réelle et sérieuse (faute, insuffisance professionnelle, inaptitude…). Procédure : convocation à un <strong>entretien préalable</strong> (LRAR ou remise en main propre), entretien au moins <strong>5 jours ouvrables</strong> après, notification motivée au moins <strong>2 jours ouvrables</strong> après l'entretien. Préavis (sauf faute grave ou lourde) : 1 mois entre 6 mois et 2 ans d'ancienneté, 2 mois au-delà (ou plus selon la convention).</li>
<li><strong>Indemnité légale de licenciement</strong> (dès 8 mois d'ancienneté, sauf faute grave) : 1/4 de mois de salaire par année jusqu'à 10 ans, 1/3 de mois par année au-delà.</li>
<li><strong>Licenciement économique</strong> : suppression ou transformation d'emploi liée à des difficultés économiques, des mutations technologiques, une réorganisation ou une cessation d'activité ; obligation de reclassement, procédure renforcée.</li>
<li><strong>Rupture conventionnelle</strong> : accord des deux parties, un ou plusieurs entretiens, convention signée, <strong>15 jours calendaires de rétractation</strong>, puis demande d'<strong>homologation</strong> à la DREETS qui dispose de <strong>15 jours ouvrables</strong> (silence = homologation). Indemnité au moins égale à l'indemnité légale. Ouvre droit au chômage.</li></ul>
<p>En cas de litige : conseil de prud'hommes. Licenciement sans cause réelle et sérieuse : indemnités encadrées par un <strong>barème</strong> (sauf nullité : harcèlement, discrimination…).</p>` },

<p>La <strong>gestion prévisionnelle des emplois, des effectifs et des compétences</strong> (GPEEC dans le public, GEPP dans le privé) consiste à anticiper l'écart entre les ressources (effectifs, compétences) et les besoins futurs.</p>
<ol><li>Cartographier les <strong>métiers</strong> et compétences actuels (répertoire des métiers du CNFPT en FPT).</li><li>Analyser la <strong>pyramide des âges</strong> et les départs prévisibles (retraites, mobilités).</li><li>Identifier les <strong>métiers sensibles</strong> (rares, en tension, en évolution).</li><li>Construire un <strong>plan d'actions</strong> : recrutement, formation, mobilité interne, transmission des savoirs, apprentissage.</li></ol>` },

<ul><li><strong>Tableau des emplois</strong> (FPT) : liste des emplois créés par délibération (grade, temps de travail, pourvu / vacant). Il doit être cohérent avec le budget.</li>
<li><strong>Masse salariale</strong> : premier poste de dépenses de fonctionnement d'une collectivité (souvent 50 à 60 %). Elle évolue sous l'effet :
<ul><li>des <strong>mesures générales</strong> (valeur du point, revalorisations du SMIC et des bas de grille, réformes) ;</li><li>du <strong>GVT</strong> (glissement vieillesse-technicité) : <em>GVT positif</em> = effet des avancements d'échelon, de grade, des promotions ; <em>GVT négatif</em> ou <em>effet de noria</em> = remplacement de départs (souvent mieux rémunérés) par des agents plus jeunes ;</li><li>des variations d'<strong>effectifs</strong> et des <strong>mesures catégorielles</strong>.</li></ul></li>
<li>On distingue <strong>effectif physique</strong> (nombre de personnes) et <strong>ETP</strong> (équivalents temps plein : un agent à 80 % = 0,8 ETP). Le <strong>ETPT</strong> tient aussi compte de la durée de présence sur l'année.</li></ul>` },
    { t: 'Les indicateurs et le RSU', html: `

  lessons: [
    { t: 'L\'obligation de prévention', html: `
<p>L'employeur (public ou privé) doit prendre les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs. Les règles du Code du travail en matière de santé et sécurité s'appliquent largement aux employeurs publics.</p>
<ul><li><strong>DUERP</strong> (document unique d'évaluation des risques professionnels) : obligatoire dès le premier salarié / agent ; inventaire des risques par unité de travail, cotation, plan d'actions ; mis à jour au moins chaque année (dès 11 salariés dans le privé) et à chaque changement important.</li>
<li><strong>Les 9 principes généraux de prévention</strong> : éviter les risques ; évaluer ceux qui ne peuvent être évités ; combattre à la source ; adapter le travail à l'homme ; tenir compte de l'évolution technique ; remplacer ce qui est dangereux ; planifier la prévention ; privilégier la protection collective ; donner des instructions appropriées.</li></ul>` },

<ul><li><strong>Assistant(s) et conseiller(s) de prévention</strong> : agents désignés, conseillent l'autorité.</li><li><strong>ACFI</strong> (agent chargé de la fonction d'inspection) : contrôle l'application des règles d'hygiène et sécurité (souvent mis à disposition par le CDG en FPT).</li><li><strong>Service de médecine préventive / de santé au travail</strong> : visites d'information et de prévention, aménagements de poste.</li><li><strong>F3SCT</strong> ou CST / CSA : avis, visites, enquêtes après accident.</li><li><strong>Registre de santé et sécurité au travail</strong> (observations des agents) et <strong>registre de signalement d'un danger grave et imminent</strong> (droit de retrait).</li></ul>

const LEVELS = [[0, 'Stagiaire RH'], [200, 'Gestionnaire RH'], [500, 'Chargée RH'], [1000, 'Responsable RH'], [2000, 'DRH en devenir'], [3500, 'Experte statutaire']];
const BOX_DAYS = [0, 1, 3, 7, 15, 30];
const TAGS = { pub: ['Public', 'tagpub'], public: ['Public', 'tagpub'], prive: ['Privé', 'tagpriv'], priv: ['Privé', 'tagpriv'], commun: ['Public & privé', 'tagcom'], com: ['Public & privé', 'tagcom'] };
const BADGES = [
  ['first_lesson', '📖', 'Première leçon'], ['first_quiz', '✅', 'Premier quiz'], ['perfect', '💯', 'Quiz parfait'], ['cards50', '🃏', '50 cartes révisées'],
  ['streak3', '🔥', '3 jours d\'affilée'], ['streak7', '🏅', '7 jours d\'affilée'], ['rush15', '⚡', '15 sigles en 60 s'], ['story', '🎭', 'Année RH terminée'],
  ['exam70', '🎓', 'Examen réussi (70 %)'], ['exam90', '🏆', 'Examen brillant (90 %)'], ['allmods', '🌟', 'Tous les modules validés'], ['daily', '☀️', 'Défi du jour'],
];
let ME = null, main = null;
const modById = (id) => MODULES.find((m) => m.id === id);
const tagBadge = (t) => `<span class="badge ${TAGS[t][1]}">${TAGS[t][0]}</span>`;

/* ---------- Progression ---------- */
const progKey = () => 'prog:' + ME.id;
function P() { return { xp: 0, read: {}, quiz: {}, cards: {}, cases: {}, games: {}, exams: [], notes: {}, streak: { last: '', count: 0 }, badges: {}, daily: {}, reviews: 0, ...store.get(progKey(), {}) }; }
function saveP(p) { store.set(progKey(), p); }
function award(p, id) { if (!p.badges[id]) { p.badges[id] = todayISO(); const b = BADGES.find((x) => x[0] === id); setTimeout(() => toast(`Badge débloqué : ${b[1]} ${b[2]}`, 3500), 300); } }
function addXP(n, fn) {
  const p = P(); p.xp += Math.round(n); fn?.(p);
  const t = todayISO();
  if (p.streak.last !== t) { p.streak.count = p.streak.last === addDays(t, -1) ? p.streak.count + 1 : 1; p.streak.last = t; }
  if (p.streak.count >= 3) award(p, 'streak3'); if (p.streak.count >= 7) award(p, 'streak7');
  if (MODULES.every((m) => (p.quiz[m.id]?.best || 0) >= 70)) award(p, 'allmods');
  saveP(p); refreshSide(p); return p;
}
function level(xp) { let i = 0; LEVELS.forEach(([min], k) => { if (xp >= min) i = k; }); const next = LEVELS[i + 1]; return { name: LEVELS[i][1], idx: i, pct: next ? ((xp - LEVELS[i][0]) / (next[0] - LEVELS[i][0])) * 100 : 100, next: next ? next[0] - xp : 0 }; }
function modProgress(p, m) {
  const read = Object.keys(p.read[m.id] || {}).length;
  const best = p.quiz[m.id]?.best || 0;
  const pct = Math.round(((read / m.lessons.length) * 0.5 + Math.min(1, best / 70) * 0.5) * 100);
  return { read, best, pct, done: read === m.lessons.length && best >= 70 };
}
function allCards() {
  const out = [];
  MODULES.forEach((m) => m.cards.forEach(([f, b], i) => out.push({ id: `${m.id}:${i}`, f, b, mod: m })));
  return out;
}
function glossCards() { return GLOSSARY.map(([t, d, s]) => ({ id: 'g:' + t, f: t, b: d, tag: s })); }
function dueCards(p, list) { const t = todayISO(); return list.filter((c) => !p.cards[c.id] || p.cards[c.id].due <= t); }
function allQuestions(filter) { const out = []; MODULES.forEach((m) => { if (!filter || filter(m)) m.quiz.forEach((q) => out.push({ ...q, mod: m })); }); return out; }

/* ---------- Connexion ---------- */
function authPage(signup) {
  const users = auth.users();
  document.body.innerHTML = `<div class="auth"><div class="box" style="width:min(460px,100%)">
    <div class="hero" style="text-align:center"><div style="font-size:2.6rem">🎓</div><h1>Sara HR</h1><p class="muted" style="margin:0">Ta plateforme pour maîtriser les RH, du privé au public.</p></div>
    <form class="card" id="f"><h2>${signup ? 'Créer mon profil' : 'Me connecter'}</h2>
    ${fInput('name', 'Prénom', signup ? 'Sara' : (users[0]?.name || ''), { req: true })}${fInput('password', 'Mot de passe', '', { type: 'password', req: true })}
    <button class="btn primary big-btn" style="width:100%;justify-content:center">${signup ? 'Commencer ma formation' : 'Entrer'}</button>
    <p class="muted" style="text-align:center;margin-top:12px">${signup ? (users.length ? '<a href="#/login">J\'ai déjà un profil</a>' : '') : '<a href="#/signup">Créer un nouveau profil</a>'}</p></form></div></div>`;
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target).entries()); const id = norm(fd.name).replace(/\s+/g, '.') + '@sarah-hr';
    try { if (signup) await auth.create({ name: fd.name, email: id, password: fd.password, role: 'learner', wsId: 'local' }); await auth.login(id, fd.password); location.hash = '#/home'; boot(); }
    catch (err) { toast(err.message.replace('E-mail', 'Prénom').replace('cet e-mail', 'ce prénom')); }
  };
}
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

function refreshSide(p = P()) {
  const lv = level(p.xp); const el = $('#sideLv'); if (!el) return;
  el.innerHTML = `<div class="row between"><strong style="color:var(--text)">${lv.name}</strong><span>${p.xp} XP</span></div>${bar(lv.pct)}<div class="row between" style="margin-top:4px"><small>🔥 ${p.streak.last === todayISO() || p.streak.last === addDays(todayISO(), -1) ? p.streak.count : 0} jour(s)</small><small>${lv.next ? lv.next + ' XP → niveau suivant' : 'Niveau max'}</small></div>`;
}

function boot() {
  ME = auth.current();
  if (!ME) return authPage(!auth.users().length || location.hash.includes('signup'));
  const p = P(); const due = dueCards(p, allCards()).length;
  main = shell({ brand: 'Sara HR', logo: '🎓', current: 'sara',
    nav: navLink('home', '🏠', 'Accueil') + navLink('paths', '🧭', 'Mes parcours') + navLink('modules', '📚', 'Tous les modules') +
      '<div class="sec">S\'entraîner</div>' + navLink('review', '🃏', 'Révisions', due ? ` <span class="badge acc" style="margin-left:auto">${due}</span>` : '') + navLink('games', '🎮', 'Jeux') + navLink('cases', '🧩', 'Cas pratiques') + navLink('exams', '📝', 'Évaluations') +
      '<div class="sec">Ressources</div>' + navLink('glossary', '🔤', 'Glossaire des sigles') + navLink('memos', '📌', 'Fiches mémo') + navLink('resources', '🔗', 'Sources officielles') + navLink('notes', '✏️', 'Mon carnet') + navLink('profile', '👤', 'Mon profil'),
    foot: `<div id="sideLv"></div><div class="row" style="margin-top:8px"><button class="btn sm" id="th">🌓</button><button class="btn sm" id="lo">Déconnexion</button></div>` });
  refreshSide(p);
  $('#lo').onclick = () => { auth.logout(); location.hash = '#/login'; boot(); };
  $('#th').onclick = toggleTheme;
  router.run();
}

  daily() {
    const p = P();

      } });

/* ---------- Flashcards (Leitner) ---------- */
function flashSession(el, cards, { all = false, onDone, emptyMsg } = {}) {
  let queue = [...(all ? shuffle(cards) : cards)]; let i = 0, known = 0, seen = 0; const again = new Set();
  if (!queue.length) { el.innerHTML = `<div class="card empty">${emptyMsg || 'Aucune carte.'}</div>`; onDone?.(); return; }
  const draw = () => {
    if (i >= queue.length) {
      el.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:2.5rem">🎉</div><h2>Session terminée</h2><p>${known} / ${seen} cartes sues du premier coup.</p>${onDone ? '<button class="btn primary" id="cont">Continuer →</button>' : '<button class="btn primary" id="again">Recommencer</button>'}</div>`;
      $('#cont', el)?.addEventListener('click', onDone); $('#again', el)?.addEventListener('click', () => flashSession(el, cards, { all, onDone, emptyMsg })); return;
    }
    const c = queue[i]; const box = P().cards[c.id]?.box || 0;
    el.innerHTML = `<div class="card"><div class="row between" style="margin-bottom:12px"><small>Carte ${i + 1} / ${queue.length}${c.mod ? ' · ' + c.mod.ico + ' ' + esc(c.mod.title) : ''}</small><small>${box ? 'Boîte ' + box : 'Nouvelle'}</small></div>
      <div class="flash" id="fc"><div class="flash-inner"><div class="flash-face flash-front"><small>Question</small>${esc(c.f)}<div class="muted" style="font-size:.8rem;font-weight:500;margin-top:14px">Clique pour retourner</div></div><div class="flash-face flash-back"><small>Réponse</small>${esc(c.b)}</div></div></div>
      <div class="row" style="justify-content:center;margin-top:16px" id="acts"><button class="btn primary big-btn" id="flip">Voir la réponse</button></div></div>`;
    const flip = () => { $('#fc', el).classList.add('flipped'); $('#acts', el).innerHTML = '<button class="btn big-btn" id="ko">🔁 À revoir</button><button class="btn primary big-btn" id="ok">✓ Je savais</button>'; $('#ok', el).onclick = () => answer(true); $('#ko', el).onclick = () => answer(false); };
    $('#fc', el).onclick = flip; $('#flip', el).onclick = flip;
  };
  const answer = (ok) => {
    const c = queue[i]; const firstTime = !again.has(c.id); if (firstTime) { seen++; if (ok) known++; }
    addXP(1, (p) => { const cur = p.cards[c.id] || { box: 0 }; const box = ok ? Math.min(5, cur.box + 1) : 1; p.cards[c.id] = { box, due: addDays(todayISO(), ok ? BOX_DAYS[box] : 0) }; p.reviews = (p.reviews || 0) + 1; if (p.reviews >= 50) award(p, 'cards50'); });
    if (!ok && !again.has(c.id)) { again.add(c.id); queue.push(c); }
    i++; draw();
  };
  draw();
}

/* ---------- Quiz ---------- */
function prepQ(q) { const order = shuffle(q.c.map((_, k) => k)); return { ...q, c: order.map((k) => q.c[k]), a: order.indexOf(q.a) }; }
function runQuiz(el, questions, { onFinish, exam = false, seconds = 0, title = '' } = {}) {
  const qs = questions.map(prepQ); const answers = new Array(qs.length).fill(null); let i = 0; const t0 = Date.now(); let timer = null, finished = false;
  const finish = () => {
    if (finished) return; finished = true; clearInterval(timer);
    const score = qs.reduce((s, q, k) => s + (answers[k] === q.a ? 1 : 0), 0);
    onFinish?.(score, qs.length, { qs, answers, dur: Math.round((Date.now() - t0) / 1000) });
  };
  if (seconds) timer = setInterval(() => { const left = seconds - Math.floor((Date.now() - t0) / 1000); const t = $('#tm', el); if (!document.body.contains(el)) return clearInterval(timer); if (t) t.textContent = `${Math.floor(Math.max(0, left) / 60)}:${String(Math.max(0, left) % 60).padStart(2, '0')}`; if (left <= 0) { toast('Temps écoulé !'); finish(); } }, 1000);
  const draw = () => {
    const q = qs[i]; const done = answers[i] !== null;
    el.innerHTML = `<div class="card"><div class="row between"><small>${title ? esc(title) + ' · ' : ''}Question ${i + 1} / ${qs.length}${q.mod ? ' · ' + q.mod.ico + ' ' + esc(q.mod.title) : ''}</small>${seconds ? '<span class="timer" id="tm">…</span>' : ''}</div>
      <div style="margin:8px 0 14px">${bar(((i + (done ? 1 : 0)) / qs.length) * 100)}</div><h3 style="font-size:1.12rem">${esc(q.q)}</h3>
      ${q.c.map((ch, k) => `<button class="choice ${exam && answers[i] === k ? 'sel' : ''} ${!exam && done ? (k === q.a ? 'good' : k === answers[i] ? 'bad' : '') : ''}" data-k="${k}" ${!exam && done ? 'disabled' : ''}>${String.fromCharCode(65 + k)}. ${esc(ch)}</button>`).join('')}
      <div id="fb">${!exam && done ? `<div class="alert ${answers[i] === q.a ? 'ok' : 'bad'}">${answers[i] === q.a ? '✅ Bonne réponse.' : '❌ Pas tout à fait.'} ${esc(q.e)}</div>` : ''}</div>
      <div class="row between" style="margin-top:10px">${exam && i > 0 ? '<button class="btn" id="prev">← Précédente</button>' : '<span></span>'}<div class="row">${exam ? '<button class="btn" id="end">Terminer l\'examen</button>' : ''}${(done || exam) && i < qs.length - 1 ? '<button class="btn primary" id="next">Suivante →</button>' : ''}${(done || exam) && i === qs.length - 1 ? '<button class="btn primary" id="fin">Voir mon résultat</button>' : ''}</div></div></div>`;
    $$('[data-k]', el).forEach((b) => b.onclick = () => { answers[i] = Number(b.dataset.k); if (exam && i < qs.length - 1) { i++; } draw(); });
    $('#next', el)?.addEventListener('click', () => { i++; draw(); });
    $('#prev', el)?.addEventListener('click', () => { i--; draw(); });
    $('#fin', el)?.addEventListener('click', async () => { if (exam && answers.includes(null) && !await ask(`${answers.filter((a) => a === null).length} question(s) sans réponse. Terminer quand même ?`)) return; finish(); });
    $('#end', el)?.addEventListener('click', async () => { if (await ask('Terminer l\'examen maintenant ?')) finish(); });
  };
  draw();
}
function quizStart(el, m) {
  const qs = shuffle(m.quiz).slice(0, 10);
  runQuiz(el, qs, { onFinish: (score, total, det) => {
    const pct = Math.round((score / total) * 100);
    addXP(score * 2, (p) => { const cur = p.quiz[m.id] || { best: 0, attempts: 0 }; p.quiz[m.id] = { best: Math.max(cur.best, pct), last: pct, attempts: cur.attempts + 1 }; award(p, 'first_quiz'); if (pct === 100) award(p, 'perfect'); });
    el.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:3rem">${pct >= 90 ? '🏆' : pct >= 70 ? '✅' : '📚'}</div><h2>${score} / ${total} — ${pct} %</h2><p>${pct >= 70 ? 'Module validé ! ' : 'Il faut 70 % pour valider le module. '}+${score * 2} XP</p>
      <div class="row" style="justify-content:center"><button class="btn" id="re">Refaire un quiz</button><a class="btn" href="#/module/${m.id}/cards">Réviser les flashcards</a>${(() => { const n = MODULES[MODULES.indexOf(m) + 1]; return n ? `<a class="btn primary" href="#/module/${n.id}">Module suivant →</a>` : ''; })()}</div></div>${reviewList(det)}`;
    $('#re', el).onclick = () => quizStart(el, m);
  } });
}
function reviewList({ qs, answers }) {
  const wrong = qs.map((q, k) => ({ q, a: answers[k] })).filter((x) => x.a !== x.q.a);
  return wrong.length ? `<div class="card"><h3>À retenir (${wrong.length} erreur${wrong.length > 1 ? 's' : ''})</h3>${wrong.map(({ q, a }) => `<div style="padding:10px 0;border-top:1px solid var(--line)"><strong>${esc(q.q)}</strong><br>${a !== null ? `<small style="color:var(--bad)">Ta réponse : ${esc(q.c[a])}</small><br>` : '<small class="muted">Sans réponse</small><br>'}<small style="color:var(--ok)">Bonne réponse : ${esc(q.c[q.a])}</small><br><small class="muted">${esc(q.e)}${q.mod ? ` — <a href="#/module/${q.mod.id}">revoir le module</a>` : ''}</small></div>`).join('')}</div>` : '';
}

function examRun(kind) {
  const cfg = { public: ['Examen blanc — Fonction publique', 20, 1200, (m) => m.tag !== 'prive'], prive: ['Examen blanc — Secteur privé', 20, 1200, (m) => m.tag !== 'public'], final: ['Examen final Sara HR', 40, 2400, null] }[kind];
  if (!cfg) return view.exams();
  const [title, n, secs, filter] = cfg;
  main.innerHTML = `<div class="page-head"><div><a href="#/exams" class="muted">← Évaluations</a><h1 style="margin-top:6px">📝 ${title}</h1><p>${n} questions · ${secs / 60} minutes · correction à la fin</p></div></div><div id="ex"><div class="card" style="text-align:center"><p>Prête ? Le chronomètre démarre dès que tu cliques.</p><button class="btn primary big-btn" id="go">Démarrer l'examen</button></div></div>`;
  $('#go').onclick = () => runQuiz($('#ex'), pick(allQuestions(filter), n), { exam: true, seconds: secs, title, onFinish: (score, total, det) => {
    const pct = Math.round((score / total) * 100);
    const byMod = {}; det.qs.forEach((q, k) => { const id = q.mod.id; byMod[id] = byMod[id] || { ok: 0, n: 0, m: q.mod }; byMod[id].n++; if (det.answers[k] === q.a) byMod[id].ok++; });
    const rec = { date: todayISO(), kind, title, score, total, pct, dur: det.dur };
    addXP(score * 3, (p) => { p.exams.push(rec); if (pct >= 70) award(p, 'exam70'); if (pct >= 90) award(p, 'exam90'); });
    const weak = Object.values(byMod).filter((x) => x.ok / x.n < 0.6);

      ${kind === 'final' && pct >= 70 ? '<button class="btn primary" id="cert">Voir mon attestation</button>' : pct >= 70 ? '<p>Réussi ! Tente l\'examen final quand tu te sens prête.</p>' : '<p>Continue : révise les modules ci-dessous et retente.</p>'}</div>

    $('#cert')?.addEventListener('click', () => certificate(rec));
  } });
}

const GAMES = {
  hub() {
    const p = P(); const g = p.games;
    const list = [['rush', '⚡', 'Sigle Rush', '60 secondes pour reconnaître un maximum de sigles.', g.rush ? `Record : ${g.rush}` : ''], ['memory', '🧠', 'Memory des sigles', 'Associe chaque sigle à sa définition.', g.memory ? `Record : ${g.memory} coups` : ''],
      ['vf', '✔️', 'Vrai ou faux chrono', '90 secondes, un maximum d\'affirmations.', g.vf ? `Record : ${g.vf}` : ''], ['pp', '⚖️', 'Privé, public ou les deux ?', 'Classe 12 règles selon le secteur.', g.pp ? `Record : ${g.pp} / 12` : ''],
      ['story', '🎭', 'Jeu de rôle : ma première année de responsable RH', '12 situations, 3 indicateurs : confiance de l\'équipe, sécurité juridique, confiance de la direction.', g.story ? `Meilleur score : ${g.story}` : '']];
    main.innerHTML = `<div class="page-head"><div><h1>Jeux</h1><p>Apprendre en s'amusant : chaque partie rapporte de l'XP.</p></div></div><div class="grid g3">${list.map(([id, i, t, d, r]) => `<a class="card mod-card" href="#/games/${id}"><span class="mod-ico">${i}</span><h3 style="margin:0">${t}</h3><p class="muted" style="margin:0;flex:1">${d}</p>${r ? `<span class="badge acc">${r}</span>` : ''}</a>`).join('')}</div>`;
  },
  rush() {
    let score = 0, streak = 0, t0 = 0, over = false; const asked = [];
    const head = `<div class="page-head"><div><a href="#/games" class="muted">← Jeux</a><h1 style="margin-top:6px">⚡ Sigle Rush</h1><p>Que signifie ce sigle ? 60 secondes. Bonus si tu enchaînes.</p></div></div>`;
    main.innerHTML = head + `<div id="g"><div class="card" style="text-align:center"><button class="btn primary big-btn" id="go">Go !</button></div></div>`;
    const el = $('#g');
    const end = () => { if (over) return; over = true; const best = Math.max(P().games.rush || 0, score);
      addXP(score * 2, (p) => { p.games.rush = best; if (score >= 15) award(p, 'rush15'); });
      el.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:3rem">⚡</div><h2>${score} point(s)</h2><p>Record : ${best} · +${score * 2} XP</p><button class="btn primary" id="re">Rejouer</button> <a class="btn" href="#/glossary">Revoir le glossaire</a></div>${asked.filter((a) => !a.ok).length ? `<div class="card"><h3>Sigles à revoir</h3>${asked.filter((a) => !a.ok).map((a) => `<p><strong>${esc(a.t)}</strong> — ${esc(a.d)}</p>`).join('')}</div>` : ''}`;
      $('#re', el).onclick = GAMES.rush; };
    const next = () => {
      if (over) return; const left = 60 - Math.floor((Date.now() - t0) / 1000); if (left <= 0) return end();
      const [t, d] = SIGLES[Math.floor(Math.random() * SIGLES.length)]; const opts = shuffle([d, ...pick(SIGLES.filter((x) => x[0] !== t), 3).map((x) => x[1])]);
      el.innerHTML = `<div class="card"><div class="row between"><strong>Score : ${score}${streak >= 3 ? ` 🔥×${streak}` : ''}</strong><span class="timer" id="tm">${left}s</span></div><h2 style="text-align:center;font-size:2.4rem;margin:18px 0">${esc(t)}</h2>${opts.map((o) => `<button class="choice" data-d="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      $$('.choice', el).forEach((b) => b.onclick = () => { const ok = b.dataset.d === d; asked.push({ t, d, ok }); if (ok) { streak++; score += streak >= 3 ? 2 : 1; } else streak = 0;
        b.classList.add(ok ? 'good' : 'bad'); $$('.choice', el).forEach((x) => { x.disabled = true; if (x.dataset.d === d) x.classList.add('good'); }); setTimeout(next, ok ? 350 : 1100); });
    };
    $('#go').onclick = () => { t0 = Date.now(); const iv = setInterval(() => { const tm = $('#tm'); if (over || !document.body.contains(el)) return clearInterval(iv); const left = 60 - Math.floor((Date.now() - t0) / 1000); if (tm) tm.textContent = Math.max(0, left) + 's'; if (left <= 0) { clearInterval(iv); end(); } }, 250); next(); };
  },
  memory() {
    const pairs = pick(SIGLES, 6); const cards = shuffle(pairs.flatMap(([t, d], k) => [{ k, txt: t }, { k, txt: d.length > 70 ? d.slice(0, 67) + '…' : d }]));
    let open = [], found = 0, moves = 0, lock = false;
    main.innerHTML = `<div class="page-head"><div><a href="#/games" class="muted">← Jeux</a><h1 style="margin-top:6px">🧠 Memory des sigles</h1><p>Retourne deux cartes : un sigle et sa définition.</p></div><strong id="mv">0 coup</strong></div><div class="memory" id="mem">${cards.map((c, i) => `<div class="mcard" data-i="${i}">?</div>`).join('')}</div>`;
    $$('.mcard').forEach((el) => el.onclick = () => {
      const i = Number(el.dataset.i); if (lock || el.classList.contains('open') || el.classList.contains('done')) return;
      el.classList.add('open'); el.textContent = cards[i].txt; open.push(el);
      if (open.length === 2) { moves++; $('#mv').textContent = moves + ' coup' + (moves > 1 ? 's' : ''); const [a, b] = open;
        if (cards[a.dataset.i].k === cards[b.dataset.i].k) { a.classList.add('done'); b.classList.add('done'); open = []; found++;
          if (found === 6) { const best = Math.min(P().games.memory || 999, moves); addXP(Math.max(10, 40 - moves * 2), (p) => { p.games.memory = best; });
            setTimeout(() => { $('#mem').insertAdjacentHTML('afterend', `<div class="card" style="text-align:center;margin-top:14px"><h2>Bravo ! ${moves} coups</h2><p>Record : ${best}</p><button class="btn primary" id="re">Rejouer</button></div>`); $('#re').onclick = GAMES.memory; }, 300); } }
        else { lock = true; setTimeout(() => { [a, b].forEach((x) => { x.classList.remove('open'); x.textContent = '?'; }); open = []; lock = false; }, 1100); } }
    });
  },
  vf() {
    const pool = shuffle(MODULES.flatMap((m) => m.tf.map((x) => ({ s: x[0], v: x[1], e: x[2], m }))));
    let i = 0, score = 0, t0 = 0, over = false; const wrong = [];
    main.innerHTML = `<div class="page-head"><div><a href="#/games" class="muted">← Jeux</a><h1 style="margin-top:6px">✔️ Vrai ou faux chrono</h1><p>90 secondes. Une erreur = la correction s'affiche 2 secondes.</p></div></div><div id="g"><div class="card" style="text-align:center"><button class="btn primary big-btn" id="go">Go !</button></div></div>`;
    const el = $('#g');
    const end = () => { if (over) return; over = true; const best = Math.max(P().games.vf || 0, score); addXP(score * 2, (p) => { p.games.vf = best; });
      el.innerHTML = `<div class="card" style="text-align:center"><h2>${score} bonne(s) réponse(s)</h2><p>Record : ${best} · +${score * 2} XP</p><button class="btn primary" id="re">Rejouer</button></div>${wrong.length ? `<div class="card"><h3>Corrections</h3>${wrong.map((w) => `<p><strong>${w.v ? 'VRAI' : 'FAUX'}</strong> — ${esc(w.s)}<br><small class="muted">${esc(w.e)}</small></p>`).join('')}</div>` : ''}`; $('#re', el).onclick = GAMES.vf; };
    const next = () => { if (over) return; if (i >= pool.length) return end(); const q = pool[i];
      el.innerHTML = `<div class="card"><div class="row between"><strong>Score : ${score}</strong><span class="timer" id="tm"></span></div><h3 style="text-align:center;font-size:1.25rem;margin:24px 0;min-height:3em">${esc(q.s)}</h3>
        <div class="row" style="justify-content:center"><button class="btn big-btn" data-v="1" style="min-width:130px">✔️ Vrai</button><button class="btn big-btn" data-v="0" style="min-width:130px">✖️ Faux</button></div><div id="fb" style="margin-top:12px"></div></div>`;
      $$('[data-v]', el).forEach((b) => b.onclick = () => { const ok = (b.dataset.v === '1') === q.v; i++; if (ok) { score++; next(); } else { wrong.push(q); $$('[data-v]', el).forEach((x) => { x.disabled = true; }); $('#fb', el).innerHTML = `<div class="alert bad">C'était <strong>${q.v ? 'VRAI' : 'FAUX'}</strong> : ${esc(q.e)}</div>`; setTimeout(next, 2000); } }); };
    $('#go').onclick = () => { t0 = Date.now(); const iv = setInterval(() => { if (over || !document.body.contains(el)) return clearInterval(iv); const left = 90 - Math.floor((Date.now() - t0) / 1000); const tm = $('#tm'); if (tm) tm.textContent = Math.max(0, left) + 's'; if (left <= 0) { clearInterval(iv); end(); } }, 250); next(); };
  },
  pp() {
    const qs = pick(PRIVE_PUBLIC, 12); let i = 0, score = 0;
    main.innerHTML = `<div class="page-head"><div><a href="#/games" class="muted">← Jeux</a><h1 style="margin-top:6px">⚖️ Privé, public ou les deux ?</h1><p>À quel secteur s'applique cette règle ?</p></div></div><div id="g"></div>`;
    const el = $('#g'); const L = { prive: '🏢 Privé', public: '🏛️ Public', deux: '🤝 Les deux' };
    const draw = () => {
      if (i >= qs.length) { const best = Math.max(P().games.pp || 0, score); addXP(score * 2, (p) => { p.games.pp = best; }); el.innerHTML = `<div class="card" style="text-align:center"><h2>${score} / ${qs.length}</h2><p>Record : ${best} · +${score * 2} XP</p><button class="btn primary" id="re">Rejouer</button></div>`; $('#re', el).onclick = GAMES.pp; return; }
      const [s, a, e] = qs[i];
      el.innerHTML = `<div class="card"><div class="row between"><small>${i + 1} / ${qs.length}</small><strong>Score : ${score}</strong></div><h3 style="text-align:center;font-size:1.2rem;margin:22px 0">${esc(s)}</h3><div class="grid g3">${Object.entries(L).map(([k, l]) => `<button class="choice" data-a="${k}" style="text-align:center">${l}</button>`).join('')}</div><div id="fb"></div></div>`;
      $$('[data-a]', el).forEach((b) => b.onclick = () => { const ok = b.dataset.a === a; if (ok) score++; $$('[data-a]', el).forEach((x) => { x.disabled = true; if (x.dataset.a === a) x.classList.add('good'); else if (x === b) x.classList.add('bad'); });
        $('#fb', el).innerHTML = `<div class="alert ${ok ? 'ok' : 'bad'}" style="margin-top:10px">${ok ? '✅' : '❌'} ${esc(e)}</div><button class="btn primary" id="nx">Suivante →</button>`; $('#nx', el).onclick = () => { i++; draw(); }; });
    };
    draw();
  },
  story() {
    const st = { equipe: 50, droit: 50, direction: 50 }; let i = 0; const log = [];
    main.innerHTML = `<div class="page-head"><div><a href="#/games" class="muted">← Jeux</a><h1 style="margin-top:6px">🎭 Ma première année de responsable RH</h1><p>Tu prends la responsabilité RH d'une communauté de communes. Chaque choix fait bouger trois indicateurs.</p></div></div><div id="g"></div>`;
    const el = $('#g');
    const gauges = () => [['equipe', '👥 Confiance équipe'], ['droit', '⚖️ Sécurité juridique'], ['direction', '🏛️ Confiance direction']].map(([k, l]) => `<div class="gauge"><span>${l}</span>${bar(st[k], st[k] < 30 ? 'var(--bad)' : st[k] > 70 ? 'var(--ok)' : '')}<strong>${st[k]}</strong></div>`).join('');
    const draw = () => {
      if (i >= STORY.length) {
        const total = st.equipe + st.droit + st.direction; const best = Math.max(P().games.story || 0, total);
        const profil = total >= 330 ? ['🌟', 'Responsable RH accomplie', 'Tu as su écouter, sécuriser et convaincre. Ta collectivité est entre de bonnes mains.'] : total >= 250 ? ['👍', 'Bonne première année', 'Des bases solides. Repère dans le bilan les situations où tu as perdu des points.'] : ['📚', 'Année difficile', 'Reprends les modules liés aux situations ratées, puis rejoue.'];
        addXP(Math.round(total / 10), (p) => { p.games.story = best; award(p, 'story'); });
        el.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:3rem">${profil[0]}</div><h2>${profil[1]}</h2><p>${profil[2]}</p><p><strong>Score : ${total} / 450</strong> · record ${best}</p></div><div class="card">${gauges()}</div>
          <div class="card"><h3>Bilan de l'année</h3>${log.map((x) => `<div style="padding:8px 0;border-top:1px solid var(--line)"><strong>${esc(x.t)}</strong> — ${esc(x.c)}<br><small class="muted">${esc(x.fb)}</small></div>`).join('')}</div><button class="btn primary" id="re">Rejouer</button>`;
        $('#re', el).onclick = GAMES.story; return;
      }
      const sc = STORY[i];
      el.innerHTML = `<div class="card">${gauges()}</div><div class="card"><small class="muted">Situation ${i + 1} / ${STORY.length} · ${esc(sc.t)}</small><h3 style="margin-top:6px;font-size:1.12rem">${esc(sc.s)}</h3>${shuffle(sc.c.map((c, k) => ({ ...c, k }))).map((c) => `<button class="choice" data-k="${c.k}">${esc(c.t)}</button>`).join('')}<div id="fb"></div></div>`;
      $$('[data-k]', el).forEach((b) => b.onclick = () => {
        const c = sc.c[b.dataset.k]; Object.entries(c.e).forEach(([k, v]) => { st[k] = clamp(st[k] + v, 0, 100); });
        const bestK = sc.c.reduce((bi, x, k) => (Object.values(x.e).reduce((s, v) => s + v, 0) > Object.values(sc.c[bi].e).reduce((s, v) => s + v, 0) ? k : bi), 0);
        log.push({ t: sc.t, c: c.t, fb: c.fb });
        $$('[data-k]', el).forEach((x) => { x.disabled = true; if (Number(x.dataset.k) === bestK) x.classList.add('good'); else if (x === b) x.classList.add('bad'); });
        const delta = Object.entries(c.e).filter(([, v]) => v).map(([k, v]) => `${{ equipe: '👥', droit: '⚖️', direction: '🏛️' }[k]} ${v > 0 ? '+' : ''}${v}`).join('  ');
        $('#fb', el).innerHTML = `<div class="alert ${Number(b.dataset.k) === bestK ? 'ok' : 'warn'}" style="margin-top:10px"><strong>${delta || 'Aucun effet'}</strong><br>${esc(c.fb)}</div><button class="btn primary" id="nx">${i < STORY.length - 1 ? 'Situation suivante →' : 'Voir mon bilan'}</button>`;
        $('#nx', el).onclick = () => { i++; draw(); };
      });
    };
    draw();
  },
};

  { t: '📅 Calendrier RH annuel (collectivité)', html: `<table><tr><th>Période</th><th>À faire</th></tr>
<tr><td>Janvier</td><td>Revalorisations éventuelles (SMIC, indices), mise à jour de la paie, bilan des congés et du CET, déclarations annuelles.</td></tr>

  { t: '✅ Check-list : arrivée d\'un agent', html: `<ol><li>Emploi au tableau des emplois, vacance déclarée et publiée</li><li>Arrêté de nomination (ou contrat visant le motif)</li><li>Dossier : pièces d'identité, diplômes, casier judiciaire (B2), RIB, carte vitale</li><li>Affiliation caisse de retraite (CNRACL / IRCANTEC)</li><li>Visite médicale d'embauche</li><li>PV d'installation, fiche de poste remise</li><li>Matériel, accès, badge</li><li>Inscription à la formation d'intégration (stagiaire FPT)</li><li>Entretien d'étape ; avis de fin de stage avant l'échéance</li></ol>` },
];
